version: '3.8'

services:
  # --- Service 1: Cơ sở dữ liệu MySQL ---
  mysqldb:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "367284"
      MYSQL_DATABASE: "demo_springboot"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p367284"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Service 2: Ứng dụng Spring Boot Java ---
  java-app:
    build: .
    container_name: my-java-app-container
    ports:
      - "8080:8080"
    environment:
      # Chú ý: Thay 'host.docker.internal' bằng tên service 'mysqldb'
      DB_URL: "jdbc:mysql://mysqldb:3306/demo_springboot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USERNAME: "root"
      DB_PASSWORD: "367284"
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data: