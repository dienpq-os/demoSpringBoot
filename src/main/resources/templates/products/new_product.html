<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm Mới</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/my_style.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Thêm Sản Phẩm Mới</h4>
                    </div>
                    <div class="card-body">
                        <form id="productForm" th:action="@{/products/save_product}" method="post" 
                              th:object="${product}" enctype="multipart/form-data" novalidate>
                            <!-- Hiện các thông báo và Lỗi validation -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                                <strong>Vui lòng sửa các lỗi sau:</strong>
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Mã sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{maSP}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tên Model <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{tenModel}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Hãng sản xuất <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{hangSanXuat}" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{giaBan}" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{soLuong}" class="form-control" required>
                                </div>

                                <table>
                                    <tr>
                                        <td>
                                            <!-- Chọn ảnh -->
                                            <div class="col-12">
                                                <label class="form-label">Chọn ảnh sản phẩm (có thể chọn nhiều)</label>
                                                <input type="file" id="imageInput" name="images" multiple accept="image/*" class="form-control">
                                            </div>
                                        </td>
                                        <td valign="middle" width = "300px">
                                        <!-- Hidden field để truyền index ảnh chính -->
                                            <input type="hidden" id="mainImageIndex" name="mainImageIndex" value="0">

                                            <div class="mt-4 text-end">
                                                <a th:href="@{/products/list_products}" class="btn btn-secondary me-2">Hủy</a>
                                                <button type="submit" class="btn btn-primary px-4">Lưu Sản Phẩm</button>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                                <!-- Preview ảnh + chọn ảnh chính -->
                                <div class="col-12">
                                    <label class="form-label">Ảnh đã chọn - Chọn 1 ảnh làm ảnh chính</label>
                                    <div id="previewContainer" class="d-flex flex-wrap gap-3"></div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainImageIndexInput = document.getElementById('mainImageIndex');

        imageInput.addEventListener('change', function() {
            previewContainer.innerHTML = '';

            if (this.files.length === 0) return;

            Array.from(this.files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="preview-img">
                        <div class="mt-2">
                            <input type="radio" name="mainImageRadio" value="${index}" 
                                   id="main_${index}" ${index === 0 ? 'checked' : ''}>
                            <label for="main_${index}" class="small">Ảnh chính</label>
                        </div>
                    `;
                    previewContainer.appendChild(div);

                    // Khi chọn radio → cập nhật hidden field
                    div.querySelector('input[type="radio"]').addEventListener('change', function() {
                        mainImageIndexInput.value = this.value;
                    });
                };
                reader.readAsDataURL(file);
            });
        });
    </script>

    <script th:src="@{/js/my_script.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
