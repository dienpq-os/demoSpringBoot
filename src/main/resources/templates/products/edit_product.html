<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .preview-img { width: 130px; height: 130px; object-fit: cover; border: 2px solid #ddd; border-radius: 8px; }
        .preview-item { position: relative; display: inline-block; margin: 8px; text-align: center; }
        .preview-item input[type="radio"] { position: absolute; top: 8px; left: 8px; z-index: 10; }
        .old-image { border: 2px solid #28a745; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Sửa Sản Phẩm</h4>
                    </div>
                    <div class="card-body">

                        <form th:action="@{/products/update_product/{maSP}(maSP=${product.maSP})}" 
                              method="post" th:object="${product}" enctype="multipart/form-data" novalidate>

                            <!-- Lỗi validation -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                                <strong>Vui lòng sửa các lỗi sau:</strong>
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Mã sản phẩm</label>
                                    <input type="text" th:field="*{maSP}" class="form-control" readonly>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label">Tên Model <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{tenModel}" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Hãng sản xuất <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{hangSanXuat}" class="form-control">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Giá bán <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{giaBan}" class="form-control">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{soLuong}" class="form-control">
                                </div>

                                <!-- Ảnh cũ -->
                                <div class="col-12">
                                    <label class="form-label">Ảnh hiện tại</label>
                                    <div id="oldImagesContainer" class="d-flex flex-wrap gap-3">
                                        <div th:each="img : ${images}" class="preview-item">
                                            <img th:src="${img.imageUrl}" class="preview-img old-image">
                                            <div class="mt-2">
                                                <input type="radio" name="mainImageId" th:value="${img.id}" 
                                                       th:checked="${img.isMain}">
                                                <label class="small">Ảnh chính</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" 
                                                       th:name="deleteImageIds" th:value="${img.id}">
                                                <label class="form-check-label text-danger small">Xóa</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Thêm ảnh mới -->
                                <div class="col-12">
                                    <label class="form-label">Thêm ảnh mới (có thể chọn nhiều)</label>
                                    <input type="file" id="newImageInput" name="images" multiple accept="image/*" class="form-control">
                                </div>

                                <!-- Preview ảnh mới -->
                                <div class="col-12">
                                    <label class="form-label">Ảnh mới đã chọn</label>
                                    <div id="newPreviewContainer" class="d-flex flex-wrap gap-3"></div>
                                </div>
                            </div>

                            <div class="mt-4 text-end">
                                <a th:href="@{/products/list_products}" class="btn btn-secondary me-2">Hủy</a>
                                <button type="submit" class="btn btn-warning px-4">Cập nhật Sản Phẩm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const newImageInput = document.getElementById('newImageInput');
        const newPreviewContainer = document.getElementById('newPreviewContainer');

        newImageInput.addEventListener('change', function() {
            newPreviewContainer.innerHTML = '';

            Array.from(this.files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="preview-img">
                        <div class="mt-2">
                            <input type="radio" name="mainImageId" value="new_${index}">
                            <label class="small">Ảnh chính</label>
                        </div>
                    `;
                    newPreviewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
