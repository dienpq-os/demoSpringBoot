<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản trị</title>
    <!-- Sử dụng Bootstrap nội bộ để giao diện đẹp ngay lập tức -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .admin-card { max-width: 500px; margin: 50px auto; border-radius: 15px; }
        .nav-link-custom { display: block; padding: 10px; margin-bottom: 10px; border-radius: 8px; text-decoration: none; transition: 0.3s; }
        .nav-link-custom:hover { background-color: #e9ecef; }
    </style>
    <script th:src="@{/js/my_script.js}"></script>

</head>
<body>
    <div class="container">
        <div class="card admin-card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">HỆ THỐNG QUẢN TRỊ</h4>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <!-- Hiển thị tên người dùng đang đăng nhập -->
                    <h5 class="mb-1">Xin chào, <span class="text-primary" sec:authentication="name">User</span>!</h5>
                    <p class="text-muted small">Quyền: <span sec:authentication="principal.authorities"></span></p>
                </div>

                <div class="list-group">
                    <a th:href="@{/products/list_products}" class="nav-link-custom border text-dark">
                        <i class="bi bi-box-seam me-2"></i> Quản lý sản phẩm
                    </a>
                    <a th:href="@{/dashboard}" class="nav-link-custom border text-dark">
                        <i class="bi bi-speedometer2 me-2"></i> Xem Dashboard
                    </a>
                    <!-- Chỉ Admin mới thấy link quản lý User -->
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/users/list_users}" class="nav-link-custom border text-dark">
                        <i class="bi bi-people me-2"></i> Quản lý người dùng
                    </a>
                    <a th:href="@{/users/change_password}" class="nav-link-custom border text-primary">
                        <i class="bi bi-key me-2"></i> Đổi mật khẩu
                    </a>
                </div>
                <hr class="my-4">

        <!-- Chèn đoạn này vào phía trên Form đăng nhập -->
        <div class="container mt-3">
            <!-- Hiển thị thông báo thành công từ RedirectAttributes (Flash) -->
            <div th:if="${success}" id="successAlert" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

                <form th:action="@{/logout}" method="post" class="text-center">
                    <button type="submit" class="btn btn-danger w-100">
                        <i class="bi bi-box-arrow-right"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
