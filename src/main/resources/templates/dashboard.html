<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản Lý Cửa Hàng Điện Thoại</title>
    
    <!-- SỬ DỤNG FILE NỘI BỘ (LOCAL) -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    
    <style>
        .card { border-radius: 12px; border: none; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .stat-card { color: white; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chart-container { position: relative; height: 350px; width: 100%; }
        .table-container { max-height: 350px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="mb-4">📊 Dashboard - Tổng Quan Hệ Thống</h1>
        
        <!-- Dữ liệu ẩn để Javascript đọc (Đã tối ưu th:value) -->
        <input type="hidden" id="brandStatsData" th:value="${brandStatsJson}" />

        <!-- 1. Hàng Thẻ Thống Kê (Stat Cards) -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card stat-card bg-primary h-100">
                    <div class="card-body">
                        <i class="bi bi-phone fs-1"></i>
                        <h5 class="mt-3">Tổng Sản Phẩm</h5>
                        <h2 class="mb-0" th:text="${totalProducts}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-success h-100">
                    <div class="card-body">
                        <i class="bi bi-currency-dollar fs-1"></i>
                        <h5 class="mt-3">Giá Trị Tồn Kho</h5>
                        <h2 class="mb-0" th:text="${#numbers.formatDecimal(totalInventoryValue, 0, 'COMMA', 0, 'POINT')} + ' đ'"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-warning text-dark h-100">
                    <div class="card-body">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                        <h5 class="mt-3">Sắp Hết Hàng (&lt;10)</h5>
                        <h2 class="mb-0" th:text="${lowStockCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-danger h-100">
                    <div class="card-body">
                        <i class="bi bi-x-circle fs-1"></i>
                        <h5 class="mt-3">Hết Hàng</h5>
                        <h2 class="mb-0" th:text="${outOfStockCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- 2. Biểu đồ (Tự động Bar/Pie) -->
            <div class="col-lg-6">
                <div class="card shadow h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-dark"><i class="bi bi-graph-up"></i> Phân Bố Sản Phẩm Theo Hãng</h5>
                    </div>
                    <div class="card-body chart-container">
                        <canvas id="brandChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 3. Danh sách tồn kho thấp + Nút PDF -->
            <div class="col-lg-6">
                <div class="card shadow h-100">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-dark"><i class="bi bi-list-stars"></i> Sản Phẩm Tồn Kho Thấp</h5>
                        <!-- NÚT TẢI PDF -->
                        <a th:href="@{/dashboard/export-pdf}" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-file-earmark-pdf"></i> Tải Báo Cáo (PDF)
                        </a>
                    </div>
                    <div class="card-body p-0 table-container">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Model</th>
                                    <th>Hãng</th>
                                    <th class="text-end pe-3">Tồn</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${lowStockProducts}">
                                    <td class="ps-3" th:text="${p.tenModel}"></td>
                                    <td th:text="${p.hangSanXuat}"></td>
                                    <td class="text-end pe-3 fw-bold" 
                                        th:classappend="${p.soLuong == 0} ? 'text-danger' : 'text-warning'"
                                        th:text="${p.soLuong}"></td>
                                </tr>
                                <tr th:if="${lowStockProducts.isEmpty()}">
                                    <td colspan="3" class="text-center py-5 text-muted">Kho hàng đang ổn định.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Điều hướng -->
        <div class="mt-5 mb-5 text-center">
            <a th:href="@{/products/list_products}" class="btn btn-primary btn-lg me-3 px-4 shadow-sm">
                <i class="bi bi-box-seam"></i> Xem Danh Sách Máy
            </a>
            <a th:href="@{/administration}" class="btn btn-outline-secondary btn-lg px-4 shadow-sm">
                <i class="bi bi-house-door"></i> Về Trang Chủ
            </a>
        </div>
    </div>

    <!-- GỌI FILE JS NỘI BỘ -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/chart.min.js}"></script>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Đọc dữ liệu JSON từ input hidden
            const jsonString = document.getElementById('brandStatsData').value || "{}";
            let brandData = JSON.parse(jsonString);

            const labels = Object.keys(brandData);
            const values = Object.values(brandData);
            const count = labels.length;

            if (count === 0) return;

            // QUY TẮC: Nếu > 5 hãng dùng Bar nằm ngang, <= 5 dùng Pie
            const isBar = count > 5;
            const colors = ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6f42c1', '#fd7e14', '#20c997', '#e83e8c'];
            const bgColors = labels.map((_, i) => colors[i % colors.length]);

            new Chart(document.getElementById('brandChart'), {
                type: isBar ? 'bar' : 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Số lượng sản phẩm',
                        data: values,
                        backgroundColor: bgColors,
                        borderWidth: isBar ? 0 : 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    indexAxis: isBar ? 'y' : 'x', // Xoay ngang nếu là Bar
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            display: !isBar, 
                            position: 'bottom' 
                        }
                    },
                    scales: isBar ? {
                        x: { beginAtZero: true }
                    } : {}
                }
            });
        });
    </script>
</body>
</html>
