<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Hệ Thống</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .card { border-radius: 15px; overflow: hidden; }
        .form-control:focus { box-shadow: none; border-color: #0d6efd; }
        .avatar-preview {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #f8f9fa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-group-text { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h5 class="mb-0"><i class="bi bi-shield-lock-fill"></i> ĐỔI MẬT KHẨU CÁ NHÂN</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4 text-center">
                            <img th:src="${avatar != null ? avatar : '/images/default-avatar.png'}" 
                                 class="avatar-preview mb-2" alt="User Avatar">
                            <p class="text-muted small">Tài khoản đăng nhập:<br>
                                <strong class="text-dark" th:text="${email}">admin@gmail.com</strong>
                            </p>
                        </div>
                        <!-- Hiển thị thông báo thành công từ RedirectAttributes (Flash) -->
                        <div th:if="${success}" id="tudongan" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <!-- Hiển thị thông báo lỗi -->
                        <div th:if="${error}" id="tudongan" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/users/update_password}" method="post" id="changePasswordForm">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu hiện tại</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" name="oldPassword" id="oldPassword" class="form-control" 
                                           placeholder="Nhập mật khẩu đang dùng" required>
                                </div>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="newPassword" id="newPassword" class="form-control" 
                                           placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                                </div>
                                <!-- ĐÃ SỬA: Chuyển class text-danger để luôn hiển thị đúng ngữ cảnh Bootstrap -->
                                <div id="lengthError" class="text-danger small mt-1 d-none">Mật khẩu phải chứa ít nhất 6 ký tự!</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" 
                                           placeholder="Nhập lại mật khẩu mới" required>
                                </div>
                                <div id="passwordError" class="text-danger small mt-1 d-none">Mật khẩu xác nhận không khớp!</div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    <i class="bi bi-arrow-repeat"></i> Cập Nhật Ngay
                                </button>
                                <a th:href="@{/administration}" class="btn btn-link text-decoration-none text-muted small">
                                    <i class="bi bi-arrow-left"></i> Quay lại trang quản trị
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-4 text-muted small">
                    Hệ thống sẽ tự động đăng xuất sau khi đổi thành công.
                </p>
            </div>
        </div>
    </div>

    <!-- SCRIPT ĐÃ ĐƯỢC SỬA LỖI ĐẾM KÝ TỰ VÀ LOGIC KHÓA NÚT -->
    <script>
        const newPass = document.getElementById('newPassword');
        const confPass = document.getElementById('confirmPassword');
        const lengthError = document.getElementById('lengthError');
        const errorDiv = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitBtn');

        function validatePassword() {
            const passValue = newPass.value;
            const confValue = confPass.value;
            
            let isLengthValid = true;
            let isMatchValid = true;

            // 1. Kiểm tra độ dài mật khẩu mới (ĐÃ SỬA: Dùng .value.length)
            if (passValue.length > 0 && passValue.length < 6) {
                lengthError.classList.remove('d-none');
                newPass.classList.add("is-invalid");
                isLengthValid = false;
            } else {
                lengthError.classList.add('d-none');
                newPass.classList.remove("is-invalid");
            }

            // 2. Kiểm tra trùng khớp mật khẩu mới
            if (confValue !== '') {
                if (passValue !== confValue) {
                    errorDiv.classList.remove('d-none');
                    confPass.classList.add("is-invalid");
                    isMatchValid = false;
                } else {
                    errorDiv.classList.add('d-none');
                    confPass.classList.remove("is-invalid");
                }
            }

            // Khóa hoặc mở nút Submit dựa trên cả 2 điều kiện
            if (isLengthValid && isMatchValid) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // ĐÃ SỬA: Dùng sự kiện 'input' để kiểm tra mượt mà theo thời gian thực ngay khi gõ
        newPass.addEventListener('input', validatePassword);
        confPass.addEventListener('input', validatePassword);
    </script>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
