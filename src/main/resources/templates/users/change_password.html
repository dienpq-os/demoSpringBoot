<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Hệ Thống</title>
    <!-- Sử dụng file nội bộ đã tải để đảm bảo giao diện luôn hiển thị -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Icon từ CDN (Rất nhẹ và giúp giao diện sinh động hơn) 
    <link rel="stylesheet" href="https://jsdelivr.net">-->
    
    <style>
        .card { border-radius: 15px; overflow: hidden; }
        .form-control:focus { box-shadow: none; border-color: #0d6efd; }
        /* Khung ảnh thẻ 4x6 thu nhỏ làm avatar */
        .avatar-preview {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #f8f9fa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-group-text { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h5 class="mb-0"><i class="bi bi-shield-lock-fill"></i> ĐỔI MẬT KHẨU CÁ NHÂN</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Hiển thị ảnh thẻ và email người dùng -->
                        <div class="mb-4 text-center">
                            <img th:src="${avatar != null ? avatar : '/images/default-avatar.png'}" 
                                 class="avatar-preview mb-2" alt="User Avatar">
                            <p class="text-muted small">Tài khoản đăng nhập:<br>
                                <strong class="text-dark" th:text="${email}">admin@gmail.com</strong>
                            </p>
                        </div>

                        <!-- Thông báo lỗi (Mật khẩu cũ sai, không khớp...) -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                            <i class="bi bi-exclamation-octagon-fill"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/users/update_password}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu hiện tại</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" name="oldPassword" class="form-control" 
                                           placeholder="Nhập mật khẩu đang dùng" required>
                                </div>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="newPassword" id="newPassword" class="form-control" 
                                           placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" 
                                           placeholder="Nhập lại mật khẩu mới" required>
                                </div>
                                <div id="passwordError" class="text-danger small mt-1 d-none">Mật khẩu xác nhận không khớp!</div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    <i class="bi bi-arrow-repeat"></i> Cập Nhật Ngay
                                </button>
                                <a th:href="@{/administration}" class="btn btn-link text-decoration-none text-muted small">
                                    <i class="bi bi-arrow-left"></i> Quay lại trang quản trị
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-4 text-muted small">
                    Hệ thống sẽ tự động đăng xuất sau khi đổi thành công.
                </p>
            </div>
        </div>
    </div>

    <!-- Script kiểm tra mật khẩu khớp nhau ngay khi gõ -->
    <script>
        const newPass = document.getElementById('newPassword');
        const confPass = document.getElementById('confirmPassword');
        const errorDiv = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitBtn');

        function validatePassword() {
            if (confPass.value === '') {
                errorDiv.classList.add('d-none');
                return;
            }
            if (newPass.value !== confPass.value) {
                errorDiv.classList.remove('d-none');
                submitBtn.disabled = true;
            } else {
                errorDiv.classList.add('d-none');
                submitBtn.disabled = false;
            }
        }

        newPass.onchange = validatePassword;
        confPass.onkeyup = validatePassword;
    </script>

    <!-- Cần Bootstrap JS để đóng thông báo lỗi -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
