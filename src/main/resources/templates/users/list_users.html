<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Người Dùng</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/my_style.css}">    
</head>
<body class="bg-light" onclick="clearAllSelection(event)">
    <div class="container mt-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-primary"><i class="bi bi-people-fill"></i> Quản Lý Người Dùng</h4>
                <a th:href="@{/users/new_user}" class="btn btn-primary btn-sm">Thêm Mới</a>
                <a th:href="@{/administration}" class="btn btn-primary btn-sm">Quay lại</a>

            </div>
            
                <!-- Hiển thị thông báo thành công từ RedirectAttributes (Flash) -->
                <div th:if="${success}" id="tudongan" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <!-- Hiển thị thông báo lỗi -->
                <div th:if="${error}" id="tudongan" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row g-3">
                    <div th:each="u : ${listUsers}" class="col-12 col-sm-6 col-md-4 col-lg-3">
                        <!-- Thêm id cho card để dễ quản lý -->
                        <div class="card h-100 shadow-sm user-card" th:id="'card-' + ${u.id}" onclick="toggleActions(event, this)">
                            
                            <div class="action-overlay">
                                <a th:href="@{/users/edit/{id}(id=${u.id})}" class="btn btn-primary btn-sm px-3">
                                    <i class="bi bi-pencil"></i> Sửa
                                </a>
                                <!-- Sửa lại: Dùng type="button" và bắt onclick chính xác -->
                                <button type="button" class="btn btn-danger btn-sm px-3" 
                                        th:onclick="'confirmDelete(event, ' + ${u.id} + ')'">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </div>

                            <div class="card-body p-2">
                                <table class="table table-borderless mb-0">
                                    <tr>
                                        <td style="width: 90px; vertical-align: top;" class="pe-0">
                                            <img th:src="${u.imageUrl != null ? u.imageUrl : '/images/users/default-avatar.png'}" class="avatar-box border">
                                        </td>
                                        <td class="align-top ps-2">
                                            <div class="fw-bold text-dark text-truncate" th:text="${u.username}"></div>
                                            <div class="small text-muted text-truncate" th:text="${u.email}"></div>
                                            <div class="mt-2">
                                                <span th:text="${u.role}" class="badge" 
                                                      th:classappend="${u.role=='ADMIN'?'bg-danger':(u.role=='KETOAN'?'bg-success':'bg-info text-dark')}"></span>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script>
        function toggleActions(event, card) {
            event.stopPropagation();
            
            // Xóa tất cả active khác
            document.querySelectorAll('.user-card').forEach(c => {
                if (c !== card) c.classList.remove('active');
            });
            
            card.classList.toggle('active');
        }

        function clearAllSelection(event) {
            // Chỉ xóa selection nếu click ra ngoài card
            if (!event.target.closest('.user-card')) {
                document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
            }
        }

        function confirmDelete(event, id) {
            // Ngăn chặn nổi bọt để không làm ẩn card ngay lập tức
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            if (confirm('Bạn có chắc chắn muốn xóa người dùng này không?')) {
                // Kiểm tra URL: nếu Controller của bạn là @RequestMapping("/users") 
                // thì URL đúng phải là /users/delete/id
                window.location.href = '/users/delete/' + id;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const alertBox = document.getElementById("tudongan");
            if (alertBox) {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                    setTimeout(() => alertBox.remove(), 500);
                }, 3000);
            }
        });
    </script>
</body>
</html>
