<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="thymeleaf.org"> <!-- ĐỒNG BỘ: Namespace của Spring Security 6 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <!-- Khai báo toàn bộ đường dẫn thư viện nội bộ có sẵn trong thư mục static của dự án -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    
    <!-- SỬA LỖI: Đổi sang tên file .min.css nội bộ bạn đã tải về để hiển thị các biểu tượng hình ảnh -->
    <link th:href="@{/css/bootstrap-icons.min.css}" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/my_style.css}">    
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                
                <!-- Khối hiển thị thông báo lỗi hệ thống khi sai tài khoản mật khẩu -->
                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Sai tài khoản hoặc mật khẩu.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Khối hiển thị thông báo đăng xuất từ trang administration chuyển hướng về -->
                <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> Bạn đã đăng xuất thành công.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Thẻ Form Đăng Nhập -->
                <div class="card border-0 shadow-lg rounded-3" style="border-radius: 15px !important;">
                    <div class="card-body p-4 p-sm-5">
                        
                        <div class="text-center mb-4">
                            <div class="display-5 text-primary mb-2">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Đăng Nhập</h3>
                            <p class="text-muted small">Vui lòng nhập tài khoản để tiếp tục</p>
                        </div>

                        <form th:action="@{/login}" method="post">
                            
                            <!-- BỔ SUNG QUAN TRỌNG: Thẻ ẩn chứa mã CSRF Token bảo mật bắt buộc của Spring Security 6 -->
                            <!-- Thẻ này giúp bạn tránh tuyệt đối lỗi 403 Forbidden khi nhấn nút Đăng nhập -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <!-- Ô nhập Tên Đăng Nhập -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <!-- Giữ nguyên thuộc tính name="username" đồng bộ bộ lọc của Security -->
                                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập tên đăng nhập" required autofocus/>
                                </div>
                            </div>

                            <!-- Ô nhập Mật khẩu -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <!-- Giữ nguyên thuộc tính name="password" đồng bộ bộ lọc của Security -->
                                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu" required/>
                                </div>
                            </div>

                            <!-- Nút Xác nhận bấm Đăng nhập -->
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                                </button>
                            </div>
                            
                        </form>

                        <!-- Liên kết mở rộng tới trang tạo tài khoản mới (User Register) -->
                        <div class="text-center mt-4 pt-2 border-top">
                            <p class="mb-0 small text-muted">
                                Chưa có tài khoản? 
                                <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Đăng ký ngay</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Tích hợp file Script xử lý tương tác (như bấm nút đóng thông báo X) của Bootstrap -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
