server.port=8080

# Database H2 (File mode)
spring.datasource.url=jdbc:h2:file:./data/products_db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;IFEXISTS=FALSE
spring.datasource.username=SA
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true

# T\u1EAFt banner
spring.main.banner-mode=off

#Cấu hình multipart để hỗ trợ upload file (nếu cần)
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # Dung lượng tối đa của 1 file
      max-request-size: 20MB   # Dung lượng tối đa của toàn bộ request
  web:
    resources:
      static-locations: classpath:/static/  # Đường dẫn đến thư mục chứa file tĩnh (ảnh, css, js)

#Cấu hình để load ảnh nhanh hơn
spring.resources.chain.strategy.content.enabled=true
spring.resources.chain.strategy.content.paths=/**
spring.resources.chain.strategy.content.cache=true
spring.resources.chain.strategy.content.version=1.0


# Railway Deployment
server.port=${PORT:8080}

# H2 Database cho Production
spring.datasource.url=jdbc:h2:mem:railway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Tắt cache Thymeleaf
spring.thymeleaf.cache=false