server.port=${PORT:8080}
spring.application.name=products

# ================== MySQL & Connection Pool (HikariCP) ==================
# ĐÃ SỬA: Thêm giá trị mặc định của Aiven trực tiếp để chống lỗi null biến môi trường
spring.datasource.url=${DB_URL:jdbc:mysql://://aivencloud.com}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:AVNS_v-9ystuK_lEXFWdKYe7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CẤU HÌNH PHÒNG VỆ DB: Chống treo Connection Pool khi hệ thống quá tải
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================== JPA / Hibernate ==================
# ĐÃ SỬA: Chuyển ddl-auto về none để tránh lỗi quét metadata khi kết nối Cloud chưa ổn định
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Quản lý Log SQL chuyên nghiệp qua Logback
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# ================== Virtual Threads (Java 21) ==================
spring.threads.virtual.enabled=true

# ================== Actuator & Observability ==================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# ================== Mail Service ==================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================== Other Config ==================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.web.resources.static-locations=classpath:/static/
spring.main.banner-mode=off
spring.h2.console.enabled=false