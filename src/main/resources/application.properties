server.port=8080

# --- Database H2 (File mode) ---
# Sử dụng đường dẫn tuyệt đối để tránh việc DB bị lưu lạc chỗ
spring.datasource.url=jdbc:h2:file:./data/products_db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=20

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ép Hibernate dùng đúng chuẩn SQL của H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Cấu hình Multipart (Upload file) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Static Resources ---
spring.web.resources.static-locations=classpath:/static/
spring.main.banner-mode=off